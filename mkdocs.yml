site_name: Clinical Tips
site_description: 個人用臨床クイックリファレンス

theme:
  name: material
  language: ja
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: ダークモードに切替
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切替
  icon:
    logo: fontawesome/solid/stethoscope
  font:
    text: Noto Sans JP
    code: Roboto Mono
  features:
    - toc.integrate
    - toc.follow
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - toc:
      toc_depth: 2
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css

nav:
  - クイックツール:
    - 臨床計算機: calculator.html
    - 薬剤等価量換算: dose-converter.html
    - 高齢者生命予後予測: elderly-prognosis.html
    - CTCAE v5/v6 検索: ctcae.html
  - 症状・救急:
    - めまい: dizziness.md
    - 胸痛: chest-pain.md
    - 低K血症: hypokalemia.md
    - 在宅NPPV：適応と設定: nppv.md
  - 感染症・支持療法:
    - 抗菌薬アレルギー: antibiotic-allergy.md
    - CDI: cdi.md
    - 好中球減少性腸炎: neutropenic-enterocolitis.md
    - 肺炎球菌ワクチン: pneumococcal-vaccine.md
    - 栄養管理: nutrition.md
  - がん診療:
    - irAEトリアージシート（PDF）: assets/ICIcheck.pdf
    - CRT後durvalumab投与中の肺臓炎: durvalumab-pneumonitis-crt.md
    - がん性疼痛・オピオイド: opioid-cancer-pain.md
    - 精巣腫瘍・胚細胞腫瘍: germ-cell-tumor.md
    - IP合併肺癌の化学療法: ip-lung-cancer.md
    - 抗癌剤の腎機能調整: chemo-renal-dose.html
    - 抗癌剤の開始・中止・減量基準:
      - S-1単剤療法: S-1.md
      - 高齢者CRT (daily CBDCA+TRT): elderly-crt-cbdca.md
      - CBDCA + PTX + TRT (WJTOG0105): chemo-criteria-cbdca-ptx-trt.md
      - CBDCA + nab-PTX (NSCLC・B法): chemo-criteria-cbdca-nabptx.md
      - レットヴィモ（セルペルカチニブ）過敏症: selpercatinib-hypersensitivity.md
  - 画像からの鑑別:
    - 多発空洞性結節: cavitary-nodule.md
    - AFOP：OP・DADとの違い: AFOP.md
  - 運用:
    - 運用ルール: operations.md
